name: Editor Frontend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Verify logo serving from a private checkout
        run: |
          chmod 600 public/zoj-logo.png
          docker build -t zoj-editor-frontend:ci .
          trap 'docker rm -f editor-assets-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name editor-assets-ci --network none \
            --add-host api:127.0.0.1 \
            -e EDITOR_INGRESS_CIDR=127.0.0.1/32 \
            -e NGINX_ENVSUBST_FILTER=EDITOR_ zoj-editor-frontend:ci
          for attempt in $(seq 1 15); do
            if docker exec editor-assets-ci wget -qO- \
              'http://127.0.0.1/zoj-logo.png?v=2' > /tmp/editor-served-logo.png; then
              cmp public/zoj-logo.png /tmp/editor-served-logo.png
              exit 0
            fi
            sleep 1
          done
          echo 'Nginx could not serve the actual logo from a private checkout.' >&2
          exit 1
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zoj-editor, editor-frontend]
    environment: production
    timeout-minutes: 90
    concurrency:
      group: editor-frontend-production
      cancel-in-progress: false
    steps:
      - name: Deploy the tested frontend without restarting workers
        run: |
          repository=/srv/editor-source/editor_frontend_v1
          git -C "$repository" fetch origin main
          git -C "$repository" show "$GITHUB_SHA":deploy/deploy-main.sh > "$RUNNER_TEMP/editor-frontend-deploy.sh"
          bash "$RUNNER_TEMP/editor-frontend-deploy.sh" "$GITHUB_SHA"
